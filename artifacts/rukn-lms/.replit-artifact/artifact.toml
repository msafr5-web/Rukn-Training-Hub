kind = "web"
previewPath = "/"
title = "Rukn Training Platform"
description = "منصة ركن لإدارة التدريب والتعلم في المملكة العربية السعودية، تشمل استكشاف الدورات، التسجيل، ومساحات المتدربين والمدربين والشركات والإدارة."
version = "1.0.0"
id = "artifacts/rukn-lms"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20957

[services.development]
run = "pnpm --filter @workspace/rukn-lms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rukn-lms", "run", "build" ]
serve = "static"
publicDir = "artifacts/rukn-lms/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20957"
BASE_PATH = "/"
