openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Private user progress and saved questions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me/state:
    get:
      operationId: getMyState
      tags: [account]
      summary: Get the signed-in user's study state
      security:
        - ClerkSession: []
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: The user's merged study state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyStateResponse"
        "401":
          description: Authentication required
  /me/state/sync:
    post:
      operationId: syncMyState
      tags: [account]
      summary: Merge local study state into the signed-in account
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStateSyncInput"
      responses:
        "200":
          description: The merged account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyStateResponse"
        "400":
          description: Invalid study state
        "401":
          description: Authentication required
components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserQuestionState:
      type: object
      properties:
        questionId:
          type: string
          minLength: 1
          maxLength: 120
        isFavorite:
          type: boolean
        favoriteUpdatedAt:
          type: string
          format: date-time
        isRead:
          type: boolean
        readUpdatedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - questionId
        - isFavorite
        - favoriteUpdatedAt
        - isRead
        - readUpdatedAt
    DeviceProgress:
      type: object
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 120
        answered:
          type: integer
          minimum: 0
        correct:
          type: integer
          minimum: 0
        sessions:
          type: integer
          minimum: 0
      required:
        - deviceId
        - answered
        - correct
        - sessions
    UserProgress:
      type: object
      properties:
        answered:
          type: integer
          minimum: 0
        correct:
          type: integer
          minimum: 0
        sessions:
          type: integer
          minimum: 0
      required:
        - answered
        - correct
        - sessions
    PracticeSessionInput:
      type: object
      properties:
        clientSessionId:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: string
          minLength: 1
          maxLength: 120
        totalQuestions:
          type: integer
          minimum: 1
        correctAnswers:
          type: integer
          minimum: 0
      required:
        - clientSessionId
        - categoryId
        - totalQuestions
        - correctAnswers
    PracticeSession:
      allOf:
        - $ref: "#/components/schemas/PracticeSessionInput"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
          required:
            - createdAt
    UserStateSyncInput:
      type: object
      properties:
        questionStates:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/UserQuestionState"
        deviceProgress:
          $ref: "#/components/schemas/DeviceProgress"
        sessions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PracticeSessionInput"
      required:
        - questionStates
        - deviceProgress
        - sessions
    MyStateResponse:
      type: object
      properties:
        questionStates:
          type: array
          items:
            $ref: "#/components/schemas/UserQuestionState"
        progress:
          $ref: "#/components/schemas/UserProgress"
        deviceProgress:
          $ref: "#/components/schemas/DeviceProgress"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PracticeSession"
      required:
        - questionStates
        - progress
        - deviceProgress
        - sessions

